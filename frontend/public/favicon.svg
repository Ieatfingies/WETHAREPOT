  <rect x="3.5" y="3.5" width="57" height="57" rx="3.5" fill="none" stroke="#3A4D39" stroke-width="1.5"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="1.5" fill="none" stroke="#D3C9B8" stroke-width="0.75" stroke-dasharray="2 2"/>
  
